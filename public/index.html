<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Симулятор TCP/UDP устройств</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('deviceSim.settings') || '{}');
        // Имена ставим как есть: незнакомое ни одному [data-theme]/[data-font]
        // правилу само откатится к значению из :root.
        var r = document.documentElement;
        r.setAttribute('data-theme', typeof s.theme === 'string' ? s.theme : 'dark');
        r.setAttribute('data-font', typeof s.font === 'string' ? s.font : 'din-wide');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-font', 'din-wide');
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/electron-dialogs.js"></script>
</head>
<body>
  <div class="titlebar">
    <img class="titlebar-icon" src="/favicon.png" alt="" aria-hidden="true" />
    <span class="titlebar-text" id="titlebarText">Симулятор TCP/UDP устройств</span>
  </div>

  <header class="app-header">
    <a class="btn btn-icon btn-back" href="/projects" id="backProjects" title="Все проекты" aria-label="Все проекты">
      <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <div class="app-header-main">
      <h1 id="pageTitle">Симулятор устройств</h1>
      <p class="hint" id="pageHint">В iRidi укажи IP этого компьютера и порт имитатора</p>
    </div>
    <div class="app-actions">
      <button type="button" class="btn" id="btnExport">Экспорт</button>
      <button type="button" class="btn" id="btnImport">Импорт</button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden" />
    </div>
  </header>

  <main class="layout" id="layout">
    <section class="panel devices-panel" id="devicesPanel">
      <div class="panel-head">
        <button type="button" class="btn btn-icon" id="btnToggleDevices" title="Свернуть список">
          <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 class="panel-label devices-title" id="devicesTitle">Устройства</h2>
        <span class="filter-wrap hidden" id="deviceFilterWrap">
          <input type="text" class="field-input device-filter" id="deviceFilter"
                 placeholder="Имя устройства" autocomplete="off" spellcheck="false" />
          <button type="button" class="filter-clear hidden" id="btnClearFilter" title="Очистить" aria-label="Очистить поиск">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </span>
        <button type="button" class="btn btn-icon" id="btnSearchDevices" title="Поиск по имени">
          <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button type="button" class="btn btn-icon btn-primary" id="btnAdd" title="Добавить устройство">
          <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="devices-run-row">
        <button type="button" class="btn btn-run-off" id="btnStartAll">Запустить все</button>
        <button type="button" class="btn btn-run-on" id="btnStopAll">Остановить все</button>
      </div>
      <div id="deviceList" class="device-list rules-wrap"></div>
    </section>

    <div class="splitter" id="splitDevices" title="Ширина списка"></div>

    <section class="panel detail" id="detailPanel">
      <p class="empty" id="detailEmpty">Выбери устройство слева</p>
      <div id="detailBody" class="hidden">
        <div class="detail-head">
          <h2 id="detailTitle" class="detail-title">Устройство</h2>
          <button type="button" class="btn" id="btnToggleRun">Запустить</button>
        </div>

        <div class="collapse-block" id="settingsBlock">
          <div class="collapse-head-row">
            <button type="button" class="collapse-head" id="btnToggleSettings">
              <span class="collapse-chevron" id="settingsChevron">
                <svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </span>
              <span>Настройки</span>
            </button>
            <span class="muted" id="settingsNote"></span>
          </div>
          <div class="settings-summary" id="settingsSummary"></div>
          <div class="collapse-body" id="settingsBody">
            <form id="settingsForm" class="form-grid">
              <label class="field">
                Имя
                <input class="field-input" name="name" required />
              </label>
              <label class="field">
                Адрес привязки
                <input class="field-input" name="bindHost" placeholder="0.0.0.0" />
              </label>
              <label class="field">
                Порт
                <input class="field-input" name="port" type="number" min="1" max="65535" required />
              </label>
              <label class="field">
                Протокол
                <select class="field-input" name="protocol">
                  <option value="tcp">TCP</option>
                  <option value="udp">UDP</option>
                </select>
              </label>
              <label class="field">
                Кодировка
                <select class="field-input" name="encoding">
                  <option value="text">Текст</option>
                  <option value="hex">Hex</option>
                </select>
              </label>
              <label class="field">
                Разделитель приёма
                <input class="field-input" name="rxDelimiter" placeholder="пусто = кадр целиком" />
              </label>
              <label class="field span-2">
                Разделитель ответа
                <input class="field-input" name="txDelimiter" placeholder="пусто = без; \r \xFF hex:FF" />
              </label>
            </form>
            <p class="section-note">Разделитель: <code class="chip">\r</code> <code class="chip">\n</code> <code class="chip">\xFF</code> <code class="chip">hex:FF</code></p>
          </div>
        </div>

        <div class="collapse-block" id="rulesBlock">
          <div class="collapse-head-row">
            <button type="button" class="collapse-head" id="btnToggleRules">
              <span class="collapse-chevron" id="rulesChevron">
                <svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </span>
              <span>Правила ответа</span>
              <span class="collapse-count" id="rulesCount">0</span>
            </button>
            <button type="button" class="btn btn-add" id="btnAddRule">Добавить правило</button>
          </div>
          <div class="collapse-body" id="rulesBody">
            <div class="rules-wrap" id="rulesTable"></div>
          </div>
        </div>

        <div class="collapse-block" id="commandsBlock">
          <div class="collapse-head-row">
            <button type="button" class="collapse-head" id="btnToggleCommands">
              <span class="collapse-chevron" id="commandsChevron">
                <svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </span>
              <span>Команды</span>
              <span class="collapse-count" id="commandsCount">0</span>
            </button>
            <button type="button" class="btn btn-add" id="btnAddCommand">Добавить команду</button>
          </div>
          <div class="collapse-body" id="commandsBody">
            <div class="rules-wrap" id="commandsTable"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="splitter" id="splitLog" title="Ширина лога"></div>

    <section class="panel log-panel" id="logPanel">
      <div class="panel-head">
        <h2 id="logTitle" class="panel-label" style="flex:1">Лог</h2>
        <label class="row-gap muted" style="cursor:pointer" title="Показывать сырые байты и буфер приёма">
          <input type="checkbox" id="chkShowRaw" />
          RAW
        </label>
        <button type="button" class="btn" id="btnClearLog">Очистить</button>
      </div>
      <div id="log" class="log log-box"></div>
      <button type="button" class="btn btn-primary log-new hidden" id="logNew" title="Прокрутить к свежим"></button>
    </section>
  </main>

  <dialog id="addDialog">
    <form method="dialog" id="addForm" class="form-stack">
      <h3>Новое устройство</h3>
      <label class="field">
        Имя
        <input class="field-input" name="name" required placeholder="VIDEOMATRIX" />
      </label>
      <label class="field">
        Порт
        <input class="field-input" name="port" type="number" min="1" max="65535" required value="8000" />
      </label>
      <label class="field">
        Протокол
        <select class="field-input" name="protocol">
          <option value="tcp">TCP</option>
          <option value="udp">UDP</option>
        </select>
      </label>
      <label class="field">
        Кодировка
        <select class="field-input" name="encoding">
          <option value="text">Текст</option>
          <option value="hex">Hex</option>
        </select>
      </label>
      <label class="field">
        Разделитель приёма
        <input class="field-input" name="rxDelimiter" value="\r\n" placeholder="пусто = без" />
      </label>
      <label class="field">
        Разделитель ответа
        <input class="field-input" name="txDelimiter" value="\r\n" placeholder="\r" />
      </label>
      <div class="row-gap">
        <button type="submit" class="btn btn-primary" value="ok">Создать устройство</button>
        <button type="button" class="btn" id="btnCancelAdd">Отмена</button>
      </div>
    </form>
  </dialog>

  <dialog id="pickDialog">
    <div class="form-stack">
      <h3 id="pickTitle">Выбор устройств</h3>
      <p class="muted" id="pickHint" style="margin:0"></p>
      <div class="row-gap">
        <button type="button" class="btn" id="btnPickAll">Отметить все</button>
        <button type="button" class="btn" id="btnPickNone">Снять отметки</button>
      </div>
      <div id="pickList" class="pick-list"></div>
      <div class="row-gap">
        <button type="button" class="btn btn-primary" id="btnPickOk">Продолжить</button>
        <button type="button" class="btn" id="btnPickCancel">Отмена</button>
      </div>
    </div>
  </dialog>

  <!-- sortable — обычный скрипт: отдаёт глобал Sortable, который ждут модули -->
  <script src="/vendor/sortable.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
